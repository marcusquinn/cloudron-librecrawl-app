name: Publish Cloudron Catalog

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudron-catalog-publish
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/marcusquinn/cloudron-librecrawl-app
  CLOUDRON_CLI_VERSION: 8.2.6
  CLOUDRON_CLI_INTEGRITY: sha512-LHd+4u6pJxDtHX1JuVuWqrUuTbkDu+iH4jjNWW6JgB4+iDLusp08rpt6gifTFPbQjbCZHhnD8LbAGzM1NzDCXw==

jobs:
  preflight:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.decide.outputs.version }}
      source: ${{ steps.decide.outputs.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate package and shell
        run: |
          bash test/package-test.sh
          shellcheck start.sh bin/librecrawl-user bin/librecrawl-retention scripts/*.sh test/*.sh
      - name: Decide whether publication is authorized and needed
        id: decide
        env:
          PUBLICATION_ENABLED: ${{ vars.CLOUDRON_PUBLICATION_ENABLED }}
        run: |
          set -euo pipefail
          version="$(jq -r .version CloudronManifest.json)"
          printf 'version=%s\nsource=%s\n' "$version" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          publish=false
          # aidevops:trust-boundary — PRs only validate; publication needs explicit operator opt-in.
          if [[ "$GITHUB_EVENT_NAME" != pull_request && "$GITHUB_REF" == refs/heads/main && "$PUBLICATION_ENABLED" == true ]]; then
            if [[ ! -f CloudronVersions.json ]] || ! jq -e --arg version "$version" '.versions[$version] != null' CloudronVersions.json >/dev/null; then
              publish=true
            fi
          fi
          printf 'publish=%s\n' "$publish" >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.source }}
          persist-credentials: false
      - name: Verify immutable source
        env:
          SOURCE: ${{ needs.preflight.outputs.source }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ needs.preflight.outputs.version }}
      - name: Record digest
        id: image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf 'ref=%s@%s\n' "$IMAGE_REPOSITORY" "$DIGEST" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  publish:
    needs: [preflight, build]
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Cloudron CLI
        run: |
          test "$(npm view "cloudron@${CLOUDRON_CLI_VERSION}" dist.integrity)" = "$CLOUDRON_CLI_INTEGRITY"
          npm install --global --ignore-scripts "cloudron@${CLOUDRON_CLI_VERSION}"
          test "$(cloudron --version)" = "$CLOUDRON_CLI_VERSION"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Require anonymously pullable image
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: docker buildx imagetools inspect "$IMAGE"
      - name: Generate and verify catalog with Cloudron CLI
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          VERSION: ${{ needs.preflight.outputs.version }}
          SOURCE: ${{ needs.preflight.outputs.source }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE"
          bash scripts/publish-cloudron-catalog.sh CloudronVersions.json "$IMAGE" "$VERSION"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: CloudronVersions.json
      - name: Verify catalog attestation
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: gh attestation verify CloudronVersions.json --bundle "$BUNDLE" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/cloudron-catalog-publish.yml" --source-ref refs/heads/main
      - name: Commit catalog and tag atomically
        env:
          GH_TOKEN: ${{ secrets.CLOUDRON_RELEASE_PAT }}
          VERSION: ${{ needs.preflight.outputs.version }}
          SOURCE: ${{ needs.preflight.outputs.source }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          git diff --exit-code "$SOURCE" -- CloudronManifest.json CHANGELOG CHANGELOG.md
          git add CloudronVersions.json
          test "$(git diff --cached --name-only)" = CloudronVersions.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore: publish Cloudron package ${VERSION} [skip ci]"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          # aidevops:trust-boundary — scoped release credential is used only after validation.
          gh auth setup-git
          git push --atomic origin HEAD:main "v${VERSION}"
