name: Publish Cloudron Catalog

# Managed caller; CLOUDRON_PUBLICATION_ENABLED gates main-only publication in
# the reusable workflow. PRs only validate and build without pushing an image.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudron-catalog-publish-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  catalog:
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    uses: marcusquinn/aidevops/.github/workflows/cloudron-catalog-publish-reusable.yml@80f3166c4993d9c833ad56f3499bea54cbda9a54
    with:
      aidevops_ref: 80f3166c4993d9c833ad56f3499bea54cbda9a54
      image_repository: ghcr.io/marcusquinn/cloudron-librecrawl-app
      cli_version: 8.2.6
      cli_integrity: sha512-LHd+4u6pJxDtHX1JuVuWqrUuTbkDu+iH4jjNWW6JgB4+iDLusp08rpt6gifTFPbQjbCZHhnD8LbAGzM1NzDCXw==
      package_checks: |
        bash test/package-test.sh
        shellcheck start.sh bin/librecrawl-user bin/librecrawl-retention scripts/*.sh test/*.sh
    secrets:
      CLOUDRON_RELEASE_PAT: ${{ secrets.CLOUDRON_RELEASE_PAT }}
