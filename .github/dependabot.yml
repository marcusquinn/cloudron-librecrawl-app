version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps):"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps):"
    # aidevops pins move with aidevops_ref via `aidevops sync-workflows`.
    ignore:
      - dependency-name: "marcusquinn/aidevops*"
